name: Build APK

on:
  push:
    paths:
      - 'app/build.gradle'   # 只有這個檔被改動才觸發
  pull_request:
    paths:
      - '.github/workflows/build.yml'   # 開 PR 且有改這個檔，也會觸發
  workflow_dispatch:                    # 手動依然可以跑

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-popsubs-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
